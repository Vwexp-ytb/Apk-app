name: Build and publish OmniCam AI release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 0.2.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnicam-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/omnicam-release.jks" >> "$GITHUB_ENV"

      - name: Choose version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'; then
            echo "::error::Version must look like 0.2.0 or 0.2.0-rc1"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=OmniCamAI-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: OmniCamAI
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        working-directory: OmniCamAI
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename release APK
        run: cp OmniCamAI/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniCamAI-release-${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: OmniCam AI ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk_name }}
