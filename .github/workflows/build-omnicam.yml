name: Build OmniCam AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OmniCamAI/**"
      - ".github/workflows/build-omnicam.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        working-directory: OmniCamAI
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCamAI-debug
          path: OmniCamAI/app/build/outputs/apk/debug/app-debug.apk
