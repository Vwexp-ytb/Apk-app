name: Build OmniCam AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OmniCamAI/**"
      - ".github/workflows/build-omnicam.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
        working-directory: OmniCamAI
      - name: Lint Android project
        run: gradle :app:lintDebug --no-daemon
        working-directory: OmniCamAI
      - name: Print lint findings for review
        if: always()
        working-directory: OmniCamAI
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              print("No lint XML report was generated.")
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          issues = root.findall(".//issue")
          print(f"Lint findings: {len(issues)}")
          for issue in issues:
              location = issue.find("location")
              where = ""
              if location is not None:
                  file = location.get("file", "")
                  line = location.find("line")
                  where = f"{file}:{line.get('line') if line is not None else '?'}"
              print(f"{issue.get('severity','?')} [{issue.get('id','?')}] {where}: {issue.get('message','')}")
          PY
      - name: Upload lint report even when lint fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniCamAI-lint-report
          path: OmniCamAI/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        working-directory: OmniCamAI
      - name: Build release candidate (unsigned in CI)
        run: gradle :app:assembleRelease --no-daemon
        working-directory: OmniCamAI
      - name: Export dependency inventory
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > dependencies-release.txt
        working-directory: OmniCamAI
      - name: Upload build and dependency reports
        uses: actions/upload-artifact@v4
        with:
          name: OmniCamAI-ci-candidates
          path: |
            OmniCamAI/app/build/outputs/apk/debug/app-debug.apk
            OmniCamAI/app/build/outputs/apk/release/app-release-unsigned.apk
            OmniCamAI/app/build/reports/lint-results-debug.html
            OmniCamAI/dependencies-release.txt
          if-no-files-found: error

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run Android instrumentation tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon
          working-directory: OmniCamAI
